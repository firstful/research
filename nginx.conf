worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  tcp_nopush on;
  server_tokens off;

  # everything writable lives under /tmp so the container runs with
  # readOnlyRootFilesystem + a single emptyDir mount (runAsNonRoot).
  client_body_temp_path /tmp/nginx/client_temp;
  proxy_temp_path /tmp/nginx/proxy_temp;
  fastcgi_temp_path /tmp/nginx/fastcgi_temp;
  uwsgi_temp_path /tmp/nginx/uwsgi_temp;
  scgi_temp_path /tmp/nginx/scgi_temp;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # health check for k8s probes
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # immutable asset hashes from vite build
    location /assets/ {
      try_files $uri =404;
      expires 30d;
      add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # raw research notes + chart images
    location ~ ^/research/ {
      types { text/markdown md; }
      try_files $uri =404;
      add_header Cache-Control "public, max-age=3600";
    }
    location ~ ^/views/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=3600";
    }

    # SPA fallback for client-side routes only (no file extension).
    # Anything that looks like a real file request and misses → 404.
    location / {
      if ($uri ~ "\.[a-zA-Z0-9]{1,8}$") { return 404; }
      try_files $uri @spa;
    }
    location @spa {
      try_files /index.html =404;
    }
  }
}
